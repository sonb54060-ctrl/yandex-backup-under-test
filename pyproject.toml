[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-under-test"
version = "0.1.0"
description = "Rehearse PostgreSQL recovery and verify versioned Object Storage attachments"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40,<2", "pg8000>=1.31,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "moto[s3]>=5,<6", "ruff>=0.12,<1", "PyYAML>=6,<7", "python-hcl2>=7,<9", "jsonschema>=4,<5"]

[project.scripts]
backup-lab = "backup_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
