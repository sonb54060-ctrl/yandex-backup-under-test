name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install -e '.[dev]'
      - run: ruff check --config pyproject.toml src tests scripts
      - run: ruff format --config pyproject.toml --check src tests scripts
      - run: pytest -q
      - run: python scripts/validate_workflow.py
      - run: python -m backup_lab.cli demo
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.3'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/base init -backend=false
      - run: terraform -chdir=infra/base validate
      - run: terraform -chdir=infra/automation init -backend=false
      - run: terraform -chdir=infra/automation validate

